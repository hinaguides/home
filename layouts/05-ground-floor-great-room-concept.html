<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Great Room Concept</title>
<link rel="stylesheet" href="../shared/base.css">
</head>
<body>
<main>
<h1>Ground floor — great room concept</h1>
<p class="lede">Concept sketch, not to scale (6 Nov 2026, early version — courtyard still on the R1 side). Shows the great room with folding glass doors on both the hall side and the courtyard side.</p>
<svg width="100%" viewBox="0 0 680 500" role="img"><title>Ground floor with a central great room</title><desc>Back wing: staff room, stairs, kitchen, parents' room. Left: family hall. Centre: great room with dining near the kitchen and living below, with folding glass doors on the hall side and the courtyard side. Right: courtyard. Front: entry, office, guest WC and a single-storey block, with gates at the front.</desc>
<rect x="50" y="50" width="580" height="400" fill="none" stroke="var(--border-stronger)" stroke-width="1.5"/>
<text class="ts" x="340" y="38" text-anchor="middle">Back wall · service lane</text>
<text class="ts" x="30" y="255" text-anchor="middle">R2</text>
<text class="ts" x="652" y="255" text-anchor="middle">R1</text>
<g class="c-gray"><rect x="54" y="54" width="118" height="84" stroke-width="0.5"/><text class="th" x="113" y="96" text-anchor="middle" dominant-baseline="central">Staff room</text></g>
<g class="c-gray"><rect x="174" y="54" width="88" height="84" stroke-width="0.5"/><text class="th" x="218" y="96" text-anchor="middle" dominant-baseline="central">Stairs</text></g>
<g class="c-gray"><rect x="264" y="54" width="134" height="84" stroke-width="0.5"/><text class="th" x="331" y="96" text-anchor="middle" dominant-baseline="central">Kitchen</text></g>
<g class="c-gray"><rect x="400" y="54" width="226" height="84" stroke-width="0.5"/><text class="th" x="513" y="88" text-anchor="middle" dominant-baseline="central">Parents' room</text><text class="ts" x="513" y="108" text-anchor="middle" dominant-baseline="central">With own bath</text></g>
<g class="c-gray"><rect x="54" y="140" width="84" height="218" stroke-width="0.5"/><text class="th" x="96" y="249" text-anchor="middle" dominant-baseline="central">Hall</text></g>
<g class="c-coral"><rect x="140" y="140" width="258" height="218" stroke-width="0.5"/><text class="th" x="269" y="185" text-anchor="middle" dominant-baseline="central">Dining</text><text class="th" x="269" y="285" text-anchor="middle" dominant-baseline="central">Great room</text><text class="ts" x="269" y="305" text-anchor="middle" dominant-baseline="central">Family and guests</text></g>
<g class="c-teal"><rect x="420" y="160" width="206" height="180" stroke-width="0.5"/><text class="th" x="523" y="250" text-anchor="middle" dominant-baseline="central">Courtyard</text></g>
<g class="c-coral"><rect x="54" y="360" width="144" height="86" stroke-width="0.5"/><text class="th" x="126" y="403" text-anchor="middle" dominant-baseline="central">Entry</text></g>
<g class="c-gray"><rect x="200" y="360" width="118" height="86" stroke-width="0.5"/><text class="th" x="259" y="403" text-anchor="middle" dominant-baseline="central">Office</text></g>
<g class="c-gray"><rect x="320" y="360" width="98" height="86" stroke-width="0.5"/><text class="th" x="369" y="403" text-anchor="middle" dominant-baseline="central">Guest WC</text></g>
<g class="c-gray"><rect x="420" y="360" width="206" height="86" stroke-width="0.5"/><text class="th" x="523" y="403" text-anchor="middle" dominant-baseline="central">1-storey block</text></g>
<line x1="140" y1="165" x2="140" y2="335" stroke="#D85A30" stroke-width="4" stroke-dasharray="8 5"/>
<line x1="400" y1="165" x2="400" y2="335" stroke="#D85A30" stroke-width="4" stroke-dasharray="8 5"/>
<text class="ts" x="340" y="470" text-anchor="middle">Front gates</text>
<line x1="200" y1="488" x2="232" y2="488" stroke="#D85A30" stroke-width="4" stroke-dasharray="8 5"/>
<text class="ts" x="242" y="492">Folding glass doors</text>
</svg>
