<h1>Ground floor — with shuttered garage</h1>
<p class="lede">Concept sketch, not to scale (6 Nov 2026, courtyard still on the R1 side). Adds the 2-car shuttered garage on the R2 corner, door into the hall, 5 ft front setback as ramp and steps, no side setbacks.</p>
<svg width="100%" viewBox="0 0 680 520" role="img"><title>Ground floor with shuttered garage</title><desc>Back wing: staff room, stairs, kitchen, parents' room behind a 5 ft service lane. Left: family hall. Centre: great room with dining, folding doors on both sides. Right: courtyard. Front row: two-car garage with a roller shutter on the R2 corner and a door into the hall, entry, guest WC, and a single-storey office under the courtyard. A 5 ft ramp strip runs along the front. Walls run straight to the R1 and R2 roads.</desc>
<text class="ts" x="340" y="22" text-anchor="middle">Back · 5 ft service lane</text>
